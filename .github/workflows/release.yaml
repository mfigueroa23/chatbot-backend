name: 'Backend Release'

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 'Verify Application'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valores de relleno: los tests no se conectan a la base de datos.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 'Installing uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.12.23
          enable-cache: true

      - name: 'Install Dependencies'
        run: 'uv sync --locked'

      - name: 'Type Check'
        run: 'uv run pyright'

      - name: 'Tests'
        run: 'uv run pytest'

  package:
    name: 'Build Docker Image'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 'Project Version'
        id: version
        run: echo "value=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: 'Login to Docker Hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: 'Build Multi-Platform Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/chatbot-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/chatbot-backend:${{ steps.version.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/chatbot-backend:sha-${{ github.sha }}

  deploy:
    name: 'Application Deployment'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 'Connecting to Local Network'
        uses: twingate/github-action@358e205bb31e636fef1dfb706228ab60eb90c181
        with:
          service-key: ${{ secrets.LOCAL_NETWORK }}

      - name: 'Deploy Application'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/chatbot-backend chatbot-backend=${{ vars.DOCKERHUB_USERNAME }}/chatbot-backend@${{ needs.package.outputs.digest }} -n chatbot

      - name: 'Verify Deployment'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/chatbot-backend -n chatbot
