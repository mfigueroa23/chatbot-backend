[project]
name = "chatbot-backend"
version = "1.0.0"
license = "Apache-2.0"
authors = [
    { name = "Marco Antonio Figueroa Sanchez", email = "marcofigueroa23@icloud.com" },
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["main.py", "src", "tests", "alembic"]
